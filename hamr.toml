# Schema reference: https://github.com/FyrmForge/hamr/blob/master/docs/guide/hamr-toml.md

[hamr]
version = "0.38.0"
scaffolded_at = "2026-09-24"

[options]
database = "sqlite"
db_connector = "sqlx"
auth = "session"
css = "tailwind"
websockets = false
e2e = false
stripe = false
locale = false
storage = "local"
alpine = false

[static]
dir = "ui/static"
dist = "ui/dist"
manifest = "internal/web/components/staticmanifest.go"
package = "components"

[dev]
# proxy_listen defaults to localhost:3000 (loopback only). To reach the dev app
# from another device on your LAN (e.g. a phone), set it to ":3000" explicitly.
proxy_target = "$PORT"
inject_reload = true
hamr_console_capture = true
hamr_console_filter = false

# Press T in hamr dev to open a public tunnel to the dev proxy (webhooks, OAuth
# callbacks, demos). Defaults to a local cloudflared quick tunnel; BASE_URL is
# set to the public URL.
# [dev.tunnel]
# provider = "cloudflared"  # or "ngrok"
# args = []                 # extra flags for the provider command
# cmd = ""                  # custom command instead; must contain {port}
# env = ["BASE_URL"]

[dev.email]
enabled = true

[[dev.watch]]
name = "templ"
watch = "**/*.templ"
ignore = "*_templ.go"
cmd = "templ generate"
debounce = 100

# One-shot build per change rather than `npx tailwindcss --watch` as a daemon:
# the long-lived watcher leaks memory over a working day. watch globs stay
# project-root-relative; dir only sets the working directory for cmd.
[[dev.watch]]
name = "tailwind"
watch = ["**/*.templ", "ui/css/input.css"]
dir = "ui"
cmd = "npm run css:build"
debounce = 200

# The custom elements (ui/ts/) compile to ui/static/js/elements/, which the
# static rule then picks up.
[[dev.watch]]
name = "ts"
watch = "ui/ts/*.ts"
dir = "ui"
cmd = "npm run ts:build"
debounce = 200

[[dev.watch]]
name = "stackrd"
watch = ["**/*.go", "**/*.templ", ".env"]
ignore = ["*_templ.go", "*_test.go"]
cmd = "go build -o ./bin/stackrd ./cmd/stackrd && ./bin/stackrd --generate"
run = "./bin/stackrd"
depends = ["templ"]
reload = "full"

[[dev.watch]]
name = "static"
watch = ["ui/static/**/*"]
cmd = "hamr gen static"
debounce = 200

[lint.templ]
# Each rule is enabled by listing it with "warning" or "error". Omit a rule or
# set it to "off" to disable it. Unknown rule IDs fail with an error.
inline-if              = "error"
inline-for             = "error"
inline-switch          = "error"
no-native-form-actions = "error"
htmx-conflict          = "error"
img-alt                = "warning"
no-href                = "warning"
inline-style           = "warning"
empty-class            = "warning"
js-href                = "warning"

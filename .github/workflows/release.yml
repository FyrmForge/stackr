name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  # One job, in this order: work out the version (dry run, no tag), build and
  # push that version's images, then tag and publish the release, attach the
  # installer and move :latest last. A failed build leaves no empty release.
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Next version (dry run)
        id: next
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry: true
          allow-initial-development-versions: true
          # Stay on 0.8.x for now: feat: bumps the patch like fix:. Drop
          # these two options to let feat: cut a minor again.
          custom-arguments: --commit-analyzer-opt minor_release_rules=release-minor --commit-analyzer-opt patch_release_rules=feat,fix

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.next.outputs.version != ''
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.next.outputs.version != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        if: steps.next.outputs.version != ''
        run: make install

      - name: Build the images
        if: steps.next.outputs.version != ''
        run: make release-images RELEASE=v${{ steps.next.outputs.version }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.next.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version images
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          docker push ghcr.io/fyrmforge/stackr:${VERSION}
          docker push ghcr.io/fyrmforge/stackr-observe:${VERSION}

      # The installer carries the digest the registry answered to the push and
      # pulls that, never the tag. No digest fails the release: make
      # release-installer refuses a release build without one.
      - name: Build the installer with the image digest
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          DIGEST=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' ghcr.io/fyrmforge/stackr:${VERSION} | sed -n 's|^ghcr.io/fyrmforge/stackr@||p' | head -n1)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ghcr.io/fyrmforge/stackr:${VERSION} after the push"; exit 1; }
          make release-installer RELEASE=v${VERSION} DIGEST=${DIGEST}
          echo "${DIGEST}" > bin/stackr-image.digest
          (cd bin && sha256sum stackr-install-linux-amd64 stackr-image.digest > SHA256SUMS)

      - name: Tag and publish the release
        if: steps.next.outputs.version != ''
        id: semantic
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          custom-arguments: --commit-analyzer-opt minor_release_rules=release-minor --commit-analyzer-opt patch_release_rules=feat,fix

      - name: Attach the installer, move latest
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          [ "${{ steps.semantic.outputs.version }}" = "$VERSION" ] || { echo "::error::released ${{ steps.semantic.outputs.version }}, built $VERSION"; exit 1; }
          gh release upload v${VERSION} bin/stackr-install-linux-amd64 bin/stackr-image.digest bin/SHA256SUMS
          docker tag ghcr.io/fyrmforge/stackr:${VERSION} ghcr.io/fyrmforge/stackr:latest
          docker push ghcr.io/fyrmforge/stackr:latest

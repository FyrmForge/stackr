name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - .gitignore
      - "docs/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - .gitignore
      - "docs/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Download Go modules
        run: go mod download

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: make install

      - name: Build
        run: make build

      - name: Verify generated templ files are committed
        run: |
          if ! git diff --quiet -- '*_templ.go'; then
            echo "::error::Generated templ files are out of date. Run 'templ generate' and commit."
            git diff --stat -- '*_templ.go'
            exit 1
          fi

      - name: Verify compiled CSS is committed
        run: |
          if ! git diff --quiet -- 'ui/static/css/output.css'; then
            echo "::error::Compiled CSS is out of date. Run 'make css-build' and commit."
            git diff --stat -- 'ui/static/css/output.css'
            exit 1
          fi

      - name: Verify generated static pages are committed
        run: |
          if ! git diff --quiet -- 'generated/'; then
            echo "::error::Generated static pages are out of date. Run 'make generate' and commit."
            git diff --stat -- 'generated/'
            exit 1
          fi
      - name: Run migrations
        env:
          DATABASE_PATH: ./data/stackr.db
        run: make migrate

      - name: Run tests
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v9

      - name: Lint templ files
        run: make templint

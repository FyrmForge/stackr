name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - .gitignore
      - "docs/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - .gitignore
      - "docs/**"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the secret scan walks history; .gitleaksignore pins findings by commit

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: make install

      - name: Build
        run: make build

      - name: Verify generated templ files are committed
        run: |
          if ! git diff --quiet -- '*_templ.go'; then
            echo "::error::Generated templ files are out of date. Run 'go tool templ generate' and commit."
            git diff --stat -- '*_templ.go'
            exit 1
          fi

      - name: Verify compiled CSS is committed
        run: |
          if ! git diff --quiet -- 'ui/static/css/output.css'; then
            echo "::error::Compiled CSS is out of date. Run 'make css-build' and commit."
            git diff --stat -- 'ui/static/css/output.css'
            exit 1
          fi

      - name: Verify compiled elements are committed
        run: |
          if ! git diff --quiet -- 'ui/static/js/elements/'; then
            echo "::error::Compiled custom elements are out of date. Run 'cd ui && npm run ts:build' and commit."
            exit 1
          fi

      - name: Verify generated static pages are committed
        run: |
          if ! git diff --quiet -- 'generated/'; then
            echo "::error::Generated static pages are out of date. Run 'make generate' and commit."
            git diff --stat -- 'generated/'
            exit 1
          fi
      - name: Run tests
        run: |
          go test -race -timeout 30m ./...
          # streams a GiB through the form parser: too slow under -race
          go test -timeout 5m -run TestCreateOperatedDumpOverLimit ./internal/web/handler/env/

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true

      - name: Lint (golangci, ts, openapi.json staleness)
        run: make lint

      - name: Lint templ files
        run: make templint

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # GO-2026-4887 and GO-2026-4883: docker daemon plugin code, no fix released.
          # GO-2026-6875 and GO-2026-6872: echo's Proxy and RateLimiter middleware defaults; stackr uses
          # neither, and hamr sets an explicit trusted-proxy IPExtractor. No fix released.
          rc=0; out=$(govulncheck ./...) || rc=$?
          echo "$out" | tail -20
          # 3 = vulnerabilities found (judged below); anything else is a scanner failure.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "::error::govulncheck failed ($rc)"; exit 1; fi
          bad=$(echo "$out" | grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' | awk '{print $3}' | grep -vE '^GO-2026-(4887|4883|6875|6872)$' || true)
          if [ -n "$bad" ]; then echo "::error::new vulnerabilities: $bad"; exit 1; fi

      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .

  # Packages that use a local Docker daemon. Left out: internal/service/internal/vip
  # (root and NET_ADMIN) and internal/service/internal/registry (live Docker Hub).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: >
          go test -tags integration -count=1 -timeout 20m
          ./internal/service/internal/docker/
          ./internal/service/internal/proxy/
          ./internal/service/internal/s3/
          ./internal/service/internal/flow/operated/
          ./internal/service/internal/leaf/registry/

  # Installs the last release, upgrades it to this commit's build through the
  # panel, then tries a broken build and expects a rollback. release.yml runs
  # only after CI passes, so a failure here stops the release.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: make install

      - name: Build the candidate (next patch after the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          IFS=. read -r maj min pat <<<"${latest#v}"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          echo "CANDIDATE=v$maj.$min.$((pat + 1))-dev.${{ github.run_number }}" >> "$GITHUB_ENV"
          make release RELEASE="v$maj.$min.$((pat + 1))-dev.${{ github.run_number }}"

      # One-off: v0.8.12's database predates the in-place operated rename of
      # 001_initial (managed_instances), so the candidate installs fresh
      # instead of upgrading from it. Restore "$CANDIDATE" "$LATEST" once a
      # release with the rename is out.
      - name: Smoke test
        run: sudo SMOKE_INSTALLER=bin/stackr-install-linux-amd64 scripts/smoke.sh "$CANDIDATE" "$CANDIDATE"

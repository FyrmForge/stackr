name: PgBouncer image

# stackr's pgbouncer image: weekly for Alpine's fixes, and when its
# Dockerfile changes. Scanned before it is pushed; a failed scan pushes nothing.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master, main]
    paths:
      - docker/pgbouncer/**
      - .github/workflows/pgbouncer-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgbouncer-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # The amd64 image, loaded, is what trivy reads; the push below builds
      # both platforms from the same cache.
      - name: Build (amd64) for the scan
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/pgbouncer
          platforms: linux/amd64
          load: true
          tags: stackr-pgbouncer:scan
          cache-from: type=gha
          pull: true

      - name: Scan
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.31.0
        with:
          image-ref: stackr-pgbouncer:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag stackr names (PoolerImage) is the major, 1, plus the date. The
      # run prints the digest: stackr pins that, not the tag.
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/pgbouncer
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/fyrmforge/stackr-pgbouncer:1
            ghcr.io/fyrmforge/stackr-pgbouncer:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "ghcr.io/fyrmforge/stackr-pgbouncer@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

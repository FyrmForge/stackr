version: "2"

run:
  timeout: 3m

linters:
  enable:
    - gocritic
    - misspell
    - depguard
  settings:
    # Service tree rules (AGENTS.md "Layering rules"). The compiler covers
    # imports into internal/service/internal from outside; depguard covers
    # the sibling rules the compiler cannot see.
    depguard:
      rules:
        leaf-no-sibling:
          list-mode: lax
          files:
            - "**/internal/service/internal/leaf/**"
            - "!$test"
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/leaf
              desc: a leaf never calls another leaf; pass facts in as arguments
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/flow
              desc: a leaf never calls a flow
        flow-no-sibling:
          list-mode: lax
          files:
            - "**/internal/service/internal/flow/**"
            - "!**/internal/service/internal/flow/promote/**"
            - "!**/internal/service/internal/flow/deploy/**"
            - "!**/internal/service/internal/flow/run/**"
            - "!$test"
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/flow
              desc: flow -> flow only on listed edges (promote -> deploy, deploy -> managed, run -> deploy)
        flow-promote-edges:
          list-mode: lax
          files:
            - "**/internal/service/internal/flow/promote/**"
            - "!$test"
          allow:
            - github.com/FyrmForge/stackr/internal/service/internal/flow/deploy
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/flow
              desc: promote may only call flow/deploy
        flow-run-edges:
          list-mode: lax
          files:
            - "**/internal/service/internal/flow/run/**"
            - "!$test"
          allow:
            - github.com/FyrmForge/stackr/internal/service/internal/flow/deploy
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/flow
              desc: run may only call flow/deploy
        flow-deploy-edges:
          list-mode: lax
          files:
            - "**/internal/service/internal/flow/deploy/**"
            - "!$test"
          allow:
            - github.com/FyrmForge/stackr/internal/service/internal/flow/managed
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal/flow
              desc: deploy may only call flow/managed
        ui-sees-view-structs:
          list-mode: lax
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service
              desc: templ takes view structs built by the handler, never a domain type
            - pkg: github.com/FyrmForge/stackr/internal/middleware
              desc: the shell is built by internal/web/render, components only render it
        service-internal-stays-inside:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/service/**"
          deny:
            - pkg: github.com/FyrmForge/stackr/internal/service/internal
              desc: only the orchestrator (internal/service) may use service internals
